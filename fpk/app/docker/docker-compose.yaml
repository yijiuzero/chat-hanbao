services:
  # PostgreSQL 数据库
  postgres:
    image: chat-hanbao-postgres:1.0.0
    container_name: chat-hanbao-postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    volumes:
      - /var/apps/chat-hanbao/shares/chat-hanbao/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - chat-network

  # Redis 缓存
  redis:
    image: chat-hanbao-redis:1.0.0
    container_name: chat-hanbao-redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - /var/apps/chat-hanbao/shares/chat-hanbao/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - chat-network

  # 后端 API 服务
  backend:
    image: chat-hanbao-backend:1.0.0
    container_name: chat-hanbao-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://chatuser:chatpass@postgres:5432/chatdb
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:8373"]'
      NLP_ENGINE: rule
    volumes:
      - /var/apps/chat-hanbao/shares/chat-hanbao/data/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chat-network

  # 前端 Web 服务
  frontend:
    image: chat-hanbao-frontend:1.0.0
    container_name: chat-hanbao-frontend
    environment:
      VITE_API_BASE: /api
    ports:
      - "8373:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chat-network

# 网络
networks:
  chat-network:
    driver: bridge
