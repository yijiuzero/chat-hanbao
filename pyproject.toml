[project]
name = "hanbao"
dynamic = ["version"]
description = "hanbao is a **personal assistant** that runs in your own environment. It talks to you over multiple channels (DingTalk, Feishu, QQ, WeChat, iMessage, etc.) and runs scheduled tasks according to your configuration. **What it can do is driven by Skills — the possibilities are open-ended.** Built-in skills include cron, PDF/Office handling, news digest, file reading, and more; you can add custom skills. All data and tasks run on your machine; no third-party hosting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "agentscope==2.0.4.post1",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "dingtalk-stream>=0.24.3",
    "alibabacloud-dingtalk>=2.2.42",
    "alibabacloud-tea-openapi>=0.4.4",
    "alibabacloud-credentials>=0.3.0",
    "alibabacloud-tea-util>=0.3.0",
    "uvicorn>=0.40.0",
    "apscheduler>=3.11.2,<4",
    "questionary>=2.1.1",
    "reme-ai==0.4.1.3",
    # [hanbao modification] removed local-LLM deps (transformers>=4.30.0,
    # modelscope>=1.35.0, huggingface_hub>=0.20.0): local LLM was cut
    # (08-17), src has zero imports of these; onnxruntime kept — it is
    # required by magika (markitdown -> document_reader skill chain).
    "python-dotenv>=1.0.0",
    "python-socks>=2.5.3",
    "onnxruntime<1.24",
    "lark-oapi>=1.5.3",
    "aiofiles>=24.1.0",
    "wecom-aibot-python-sdk==1.0.2",
    "shortuuid>=1.0.0",
    "google-genai>=1.67.0",
    "tzdata>=2024.1",
    "cryptography>=43.0.1",  # [hanbao modification] bump past CVE-2024-6119 (43.0.0 vulnerable)
    "keyring>=25.0.0",
    "pyyaml>=6.0",
    "wcmatch>=10.0",
    "json-repair>=0.30.0",
    "segno>=1.6.6",
    "pillow>=10.0.0",
    "agent-client-protocol>=0.9.0,<0.11.0",
    # Streaming-markdown terminal UI for the bundled `hanbao` TUI
    # (v4+ adds the streaming Markdown widget). 8.2.8 fixes parsing of
    # multi-codepoint Kitty "associated text" so input methods (Chinese,
    # Japanese, accents, ...) no longer leak escape sequences into the prompt
    # (Textualize/textual#6592). Keep the temporary upper bound in sync with
    # the TUI compatibility shim for Textualize/textual#6643; remove both
    # after Textual ships and Hanbao verifies the upstream fix.
    "textual>=8.2.8,<8.2.9",
    "psutil>=6.0.0",
    "openai>=2.0.0,<=2.33.0",
    # anyio 4.13.0: _deliver_cancellation busy-loop / getpid storm (Hanbao#2632)
    "anyio>=4.0.0,<4.13.0",
    "watchfiles>=0.22",
    "orjson>=3.9",
    # [hanbao modification] markdownify (MIT) replaces html2text (GPL-3.0) —
    # GPL is copyleft and incompatible with Apache-2.0 redistribution (R5).
    "markdownify>=1.0.0",
    # [hanbao modification] Read PDF/Office documents via MarkItDown (MIT)
    # after removing Anthropic-proprietary docx/pdf/pptx/xlsx skills (I-019).
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    # [hanbao modification] Self-built document edit/create tools (I-019):
    # python-docx + openpyxl are both MIT, replacing the removed Anthropic
    # proprietary docx/xlsx skills with a license-clean implementation.
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/yijiuzero/chat-hanbao"
Repository = "https://github.com/yijiuzero/chat-hanbao"
Documentation = "https://github.com/yijiuzero/chat-hanbao"
Issues = "https://github.com/yijiuzero/chat-hanbao/issues"

[tool.setuptools.dynamic]
version = {attr = "hanbao.__version__.__version__"}

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
# Dockerfile copies console build output to src/hanbao/console/ (no dist subdir).
"hanbao" = [
    "console/**",
    "agents/md_files/**",
    "agents/skills/**",
    "tokenizer/**",
    "security/tool_guard/rules/**",
    "security/skill_scanner/rules/**",
    "security/skill_scanner/data/**",
    "docs/*.md",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
hanbao = "hanbao.cli.main:cli"
copaw = "hanbao.cli.main:cli"

# Optional doctor plugins: callable (DoctorRunContext) -> list[str]
# [project.entry-points."hanbao.doctor"]
# my_pkg = "my_pkg.doctor:doctor_notes"
# Legacy group "copaw.doctor" is still loaded when present.

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.0.0",
]
dev = [
    "pre-commit>=4.2.0",
]
# [hanbao modification] local extra kept empty: local-LLM deps removed
# (huggingface_hub etc.). Kept as an empty extra so that
# "hanbao[local,whisper]" (full) still resolves without error.
local = []
whisper = [
    "openai-whisper>=20231117",
]
full = [
    "hanbao[local,whisper]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "p0: critical user flows (messaging, CRUD, global config, security); PR smoke gate",
    "p1: supported features (settings, scoped overrides, helpers); nightly regression",
    "p2: error paths, 404 handling, validation, contracts, metadata",
    "unit: marks tests as unit tests",
    "contract: marks tests as contract tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src/hanbao"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
fail_under = 30
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
