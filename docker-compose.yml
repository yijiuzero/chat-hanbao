services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: chat-hanbao-postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    volumes:
      # NAS 目录映射 - 数据持久化到宿主机
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # 冷门端口 5632，避免与 NAS 已有服务冲突
      - "5632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 资源限制 - 适配 NAS 低内存环境
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - chat-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: chat-hanbao-redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      # NAS 目录映射
      - ./data/redis:/data
    ports:
      # 冷门端口 6399
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - chat-network

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-hanbao-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://chatuser:chatpass@postgres:5432/chatdb
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:8373","http://localhost:3000"]'
      NLP_ENGINE: rule
    volumes:
      - ./backend:/app
      # 日志持久化到 NAS
      - ./logs:/app/logs
    ports:
      # 冷门端口 8399
      - "8399:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - chat-network

  # 前端 Web 服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-hanbao-frontend
    environment:
      VITE_API_BASE: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # 冷门端口 8373
      - "8373:5173"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - chat-network

# 网络
networks:
  chat-network:
    driver: bridge
