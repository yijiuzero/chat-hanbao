name: Build & Package Offline FPK

# 纯离线打包：在本机 (GitHub runner) 内 docker build，把镜像内嵌进 fpk，
# 安装时飞牛本地 docker load，完全不依赖 Docker Hub。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ]; then VERSION=latest; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build images locally (offline, no Docker Hub)
        run: |
          docker build -t chat-hanbao-postgres:${{ steps.meta.outputs.version }} ./backend/postgres
          docker build -t chat-hanbao-redis:${{ steps.meta.outputs.version }} ./backend/redis
          docker build -t chat-hanbao-backend:${{ steps.meta.outputs.version }} ./backend
          docker build -t chat-hanbao-frontend:${{ steps.meta.outputs.version }} ./frontend

      - name: Export images into fpk (offline)
        run: |
          mkdir -p fpk/app/docker/images
          docker save \
            chat-hanbao-postgres:${{ steps.meta.outputs.version }} \
            chat-hanbao-redis:${{ steps.meta.outputs.version }} \
            chat-hanbao-backend:${{ steps.meta.outputs.version }} \
            chat-hanbao-frontend:${{ steps.meta.outputs.version }} \
            | gzip > fpk/app/docker/images/chat-hanbao-images.tar.gz
          ls -lh fpk/app/docker/images/

      - name: Download fnpack
        run: |
          for url in \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 ; do
            if curl -fsSL "$url" -o fnpack; then echo "downloaded: $url"; break; fi
          done
          chmod +x fnpack
          ./fnpack --version || ./fnpack -h || true

      - name: Build FPK with fnpack
        run: |
          ./fnpack build fpk
          FPK=$(find . -maxdepth 2 -name "*.fpk" | head -1)
          echo "Generated: $FPK"
          mv "$FPK" "chat-hanbao-${{ steps.meta.outputs.version }}.fpk"
          ls -lh chat-hanbao-*.fpk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Chat Hanbao ${{ steps.meta.outputs.version }}"
          files: "chat-hanbao-${{ steps.meta.outputs.version }}.fpk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
