name: Build & Package Offline FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_REPO: yijiuzero/chat-hanbao

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ]; then VERSION=latest; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build & Push PostgreSQL
        uses: docker/build-push-action@v5
        with:
          context: ./backend/postgres
          push: true
          tags: yijiuzero/chat-hanbao-postgres:${{ steps.meta.outputs.version }}

      - name: Build & Push Redis
        uses: docker/build-push-action@v5
        with:
          context: ./backend/redis
          push: true
          tags: yijiuzero/chat-hanbao-redis:${{ steps.meta.outputs.version }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: yijiuzero/chat-hanbao-backend:${{ steps.meta.outputs.version }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: yijiuzero/chat-hanbao-frontend:${{ steps.meta.outputs.version }}

      # ---- 离线打包：把镜像导出到 fpk 内嵌目录 ----
      - name: Pull images locally & export into fpk (offline)
        run: |
          docker pull yijiuzero/chat-hanbao-postgres:${{ steps.meta.outputs.version }}
          docker pull yijiuzero/chat-hanbao-redis:${{ steps.meta.outputs.version }}
          docker pull yijiuzero/chat-hanbao-backend:${{ steps.meta.outputs.version }}
          docker pull yijiuzero/chat-hanbao-frontend:${{ steps.meta.outputs.version }}
          mkdir -p fpk/app/docker/images
          docker save \
            yijiuzero/chat-hanbao-postgres:${{ steps.meta.outputs.version }} \
            yijiuzero/chat-hanbao-redis:${{ steps.meta.outputs.version }} \
            yijiuzero/chat-hanbao-backend:${{ steps.meta.outputs.version }} \
            yijiuzero/chat-hanbao-frontend:${{ steps.meta.outputs.version }} \
            | gzip > fpk/app/docker/images/chat-hanbao-images.tar.gz
          echo "=== images dir ==="
          ls -lh fpk/app/docker/images/

      # ---- 用飞牛官方 fnpack 打包成合规 fpk ----
      - name: Download fnpack
        run: |
          curl -sL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack
          ./fnpack --version || ./fnpack -h || true

      - name: Build FPK with fnpack
        run: |
          ./fnpack build fpk
          FPK=$(find . -maxdepth 2 -name "*.fpk" | head -1)
          echo "Generated: $FPK"
          mv "$FPK" "chat-hanbao-${{ steps.meta.outputs.version }}.fpk"
          ls -lh chat-hanbao-*.fpk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Chat Hanbao ${{ steps.meta.outputs.version }}"
          files: "chat-hanbao-${{ steps.meta.outputs.version }}.fpk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
